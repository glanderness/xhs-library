<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Beef 小红书内容库工作流程</title>
  <desc id="desc">分享链接经过数据读取、目标选择和本地整理后，可以只保存在本地，也可以同步到飞书视频表和作者表。</desc>
  <rect width="1200" height="380" rx="28" fill="#12151A"/>
  <text x="56" y="60" fill="#F7F5F2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="38" font-weight="760">从分享链接到可检索内容库</text>
  <text x="56" y="92" fill="#8F99A7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">飞书同步是可选分支，本地资料始终保留</text>

  <g transform="translate(54 132)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g>
      <rect width="218" height="122" rx="20" fill="#20242C" stroke="#3A404A"/>
      <circle cx="28" cy="28" r="12" fill="#FF5A64"/>
      <text x="51" y="35" fill="#FF9097" font-size="16" font-weight="750">输入</text>
      <text x="22" y="75" fill="#F4F5F7" font-size="23" font-weight="680">分享链接或文字</text>
      <text x="22" y="103" fill="#929CAA" font-size="16">保留用户原始输入</text>
    </g>

    <path d="M230 61 H266" stroke="#66707D" stroke-width="3"/>
    <path d="M258 52 L267 61 L258 70" fill="none" stroke="#66707D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(278)">
      <rect width="218" height="122" rx="20" fill="#20242C" stroke="#3A404A"/>
      <circle cx="28" cy="28" r="12" fill="#B08CFF"/>
      <text x="51" y="35" fill="#C5AEFF" font-size="16" font-weight="750">读取与选择</text>
      <text x="22" y="75" fill="#F4F5F7" font-size="23" font-weight="680">TikHub 数据</text>
      <text x="22" y="103" fill="#929CAA" font-size="16">确认目标笔记与作者</text>
    </g>

    <path d="M508 61 H544" stroke="#66707D" stroke-width="3"/>
    <path d="M536 52 L545 61 L536 70" fill="none" stroke="#66707D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(556)">
      <rect width="250" height="122" rx="20" fill="#20242C" stroke="#3A404A"/>
      <circle cx="28" cy="28" r="12" fill="#4CC38A"/>
      <text x="51" y="35" fill="#7DDBAE" font-size="16" font-weight="750">本地整理</text>
      <text x="22" y="75" fill="#F4F5F7" font-size="23" font-weight="680">封面 · 字幕 · 总结</text>
      <text x="22" y="103" fill="#929CAA" font-size="16">写入元数据与执行报告</text>
    </g>

    <path d="M818 61 H854" stroke="#66707D" stroke-width="3"/>
    <path d="M846 52 L855 61 L846 70" fill="none" stroke="#66707D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(866)">
      <rect width="226" height="122" rx="20" fill="#20242C" stroke="#3370FF" stroke-width="2"/>
      <circle cx="28" cy="28" r="12" fill="#3370FF"/>
      <text x="51" y="35" fill="#79A5FF" font-size="16" font-weight="750">可选同步</text>
      <text x="22" y="75" fill="#F4F5F7" font-size="23" font-weight="680">飞书 Base</text>
      <text x="22" y="103" fill="#929CAA" font-size="16">关联作者并确认记录</text>
    </g>

    <path d="M681 134 V178 H977 V148" fill="none" stroke="#4CC38A" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="710" y="164" width="238" height="42" rx="21" fill="#173126" stroke="#2F7D5A"/>
    <text x="738" y="191" fill="#7DDBAE" font-size="17" font-weight="700">--skip-feishu：只保存在本地</text>
  </g>
</svg>
