<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">小红书内容库</title>
  <desc id="desc">把一条小红书分享链接整理为本地资料，并可选同步到飞书多维表格。</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121418"/>
      <stop offset="1" stop-color="#1B1E25"/>
    </linearGradient>
    <linearGradient id="link-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A64"/>
      <stop offset="1" stop-color="#3370FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#hero-bg)"/>
  <path d="M0 318 C220 260 345 390 560 326 C760 268 930 340 1200 278 L1200 400 L0 400 Z" fill="#FFFFFF" opacity="0.025"/>

  <g id="title-block" transform="translate(64 54)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="238" height="34" rx="17" fill="#FF5A64" opacity="0.14"/>
    <circle cx="20" cy="17" r="5" fill="#FF5A64"/>
    <text x="34" y="23" fill="#FF8A91" font-size="16" font-weight="700" letter-spacing="1.4">CODEX SKILL + CLI</text>

    <text x="0" y="112" fill="#F8F6F2" font-size="62" font-weight="760">小红书内容库</text>
    <text x="0" y="160" fill="#F8F6F2" font-size="30" font-weight="600">把一条分享链接，变成可检索的内容资产</text>
    <text x="0" y="205" fill="#AEB6C2" font-size="21">封面 · 字幕 · 元数据 · 核心总结 · 飞书 Base</text>

    <g transform="translate(0 246)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="450" height="54" rx="14" fill="#0B0D10" stroke="#323741"/>
      <circle cx="24" cy="27" r="6" fill="#FF5A64"/>
      <text x="44" y="34" fill="#E8EBF0" font-size="19">开始初始化</text>
      <path d="M402 22 L414 27 L402 32" fill="none" stroke="#3370FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="project-proof" transform="translate(660 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <path d="M92 60 C160 60 155 183 222 183 C288 183 283 302 350 302" fill="none" stroke="url(#link-flow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="92" cy="60" r="7" fill="#FF5A64"/>
    <circle cx="222" cy="183" r="7" fill="#9A78FF"/>
    <circle cx="350" cy="302" r="7" fill="#3370FF"/>

    <g transform="translate(0 12)">
      <rect width="300" height="96" rx="18" fill="#20242C" stroke="#3A404B"/>
      <text x="22" y="31" fill="#FF8A91" font-size="16" font-weight="700">01 · 分享链接</text>
      <text x="22" y="64" fill="#F4F5F7" font-size="23" font-weight="650">xhslink.com/o/...</text>
      <text x="22" y="87" fill="#929CAA" font-size="16">短链接 / 完整链接 / 分享文字</text>
    </g>

    <g transform="translate(118 130)">
      <rect width="330" height="106" rx="18" fill="#20242C" stroke="#3A404B"/>
      <text x="22" y="31" fill="#B79BFF" font-size="16" font-weight="700">02 · 本地资料</text>
      <text x="22" y="65" fill="#F4F5F7" font-size="21" font-weight="650">note.md · transcript · summary</text>
      <text x="22" y="91" fill="#929CAA" font-size="16">保留原始响应与执行报告</text>
    </g>

    <g transform="translate(238 258)">
      <rect width="300" height="88" rx="18" fill="#20242C" stroke="#3A404B"/>
      <text x="22" y="28" fill="#6EA0FF" font-size="16" font-weight="700">03 · 飞书内容库</text>
      <text x="22" y="57" fill="#F4F5F7" font-size="22" font-weight="650">视频笔记 ↔ 对标博主</text>
      <text x="22" y="78" fill="#929CAA" font-size="16">可选同步 · 自动关联</text>
    </g>
  </g>
</svg>
